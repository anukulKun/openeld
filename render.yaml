services:
  - type: web
    name: openeld
    runtime: docker
    plan: free
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: openeld-db
          property: connectionString

databases:
  - name: openeld-db
    plan: free
