# Fly.io configuration for OpenELD backend
# Deploy: fly launch --copy-config
# First time: fly launch
# Then: fly deploy

app = "openeld-backend"
primary_region = "iad"

[env]
  PORT = "8000"
  DJANGO_DEBUG = "False"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
